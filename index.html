<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MingJunYi1024 的学习笔记</title>
  <meta name="description" content="算法、数学与学习记录">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">MingJunYi1024 · Notes</p>
      <h1>学习笔记与博客</h1>
      <p class="intro">记录算法、数学、竞赛和一路走来的思考。</p>
    </header>
    <section>
      <div class="section-heading">
        <h2>全部文章</h2>
        <span id="count" class="muted"></span>
      </div>
      <div id="posts" class="post-list"></div>
    </section>
    <footer>Hosted with GitHub Pages · <a href="https://github.com/MingJunYi1024" rel="noreferrer">GitHub</a></footer>
  </main>
  <script>
    const posts = [
      ["2026-09.txt", "2026.9 · 做题记录与方法总结", "竞赛记录、题解与方法复盘"],
      ["2026-08.txt", "2026.8 · 做题记录与方法总结", "竞赛记录、题解与方法复盘"],
      ["2026-07.txt", "2026.7 · 做题记录与方法总结", "竞赛记录、题解与方法复盘"],
      ["2024-11.txt", "2024.11 · 做题记录与方法总结", "竞赛记录、题解与方法复盘"],
      ["2024-08.txt", "2024.8 · 做题记录与方法总结", "竞赛记录、题解与方法复盘"],
      ["number-theory.txt", "初等数论重要定理与推论", "数学学习笔记"],
      ["probability.txt", "概率与计算", "数学学习笔记"],
      ["matrix.txt", "矩阵写法", "算法与数学工具"],
      ["templates.txt", "模板大集合", "竞赛代码与常用模板"],
      ["experience.txt", "经验之谈", "算法学习中的思考与总结"],
      ["magic.txt", "炫酷变换魔术", "技巧记录"],
      ["csp-s-2024.txt", "CSP-S 2024 记录", "竞赛记录"],
      ["gaokao-trip.txt", "高考游记", "个人记录"]
    ];
    document.querySelector("#count").textContent = `${posts.length} 篇`;
    document.querySelector("#posts").innerHTML = posts.map(([file, title, desc]) => `
      <a class="post" href="post.html?file=${encodeURIComponent(file)}">
        <div><h3>${title}</h3><p>${desc}</p></div><span class="arrow">→</span>
      </a>`).join("");
  </script>
</body>
</html>
