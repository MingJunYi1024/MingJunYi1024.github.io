<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 · MingJunYi1024</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
</head>
<body>
  <main class="shell article-shell">
    <nav><a href="index.html" class="back">← 返回文章列表</a></nav>
    <article id="article" class="article"><p class="muted">正在加载文章…</p></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
  <script>
    const file = new URLSearchParams(location.search).get("file");
    const article = document.querySelector("#article");
    const allowed = file && file.endsWith(".txt") && /^[a-z0-9-]+\.txt$/i.test(file);
    if (!allowed) article.innerHTML = "<h1>文章不存在</h1><p><a href='index.html'>返回首页</a></p>";
    else {
      const titles = {
        "2026-09.txt": "2026.9 - 做题记录与方法总结",
        "2026-08.txt": "2026.8 - 做题记录与方法总结",
        "2026-07.txt": "2026.7 - 做题记录与方法总结",
        "2024-11.txt": "2024.11 - 做题记录与方法总结",
        "2024-08.txt": "2024.8 - 做题记录与方法总结"
      };
      document.title = `${titles[file] || "文章"} · MingJunYi1024`;
      article.innerHTML = `<iframe class="reader" title="${titles[file] || "文章"}" src="${file}"></iframe>`;
    }
  </script>
  <script>
    window.MathJax = { tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] }, svg: { fontCache: "global" } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
